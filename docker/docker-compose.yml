version: '3.8'

services:
  fqworkstation-builder:
    image: emiren-co/fqworkstation-root:latest
    build: ..
    pull_policy: never


  nginx:
    restart: always
    build:
      context:
        ../frontend

    ports:
      - "80:80"
    links:
      - fqw
      - support
      - protocol
  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_DB=fqworkstation
      - POSTGRES_USER=temp
      - POSTGRES_PASSWORD=temp
      - COMPOSE_BAKE=true
    ports:
      - "5432:5432"

  db-support:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_DB=support
      - POSTGRES_USER=temp
      - POSTGRES_PASSWORD=temp
      - COMPOSE_BAKE=true
    ports:
      - "5433:5432"
  fqw:
    restart: always
    image: emiren-co/fqworkstation-root:latest
    ports:
      - "13131:13131"
    pull_policy: never
    depends_on:
      - db
      - fqworkstation-builder
    volumes:
      - ../fqw/src/main/resources:/app/resources/
    environment:
      - SPRING_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/fqworkstation
      - SPRING_DATASOURCE_USERNAME=temp
      - SPRING_DATASOURCE_PASSWORD=temp
      - SPRING_SECOND_DATASOURCE_USERNAME=temp
      - SPRING_SECOND_DATASOURCE_PASSWORD=temp
      - SPRING_SECURITY_USER_NAME="${SECURITY_LOGIN}"
      - SPRING_SECURITY_USER_PASSWORD="${SECURITY_PASSWORD}"
      - SPRING_MAIL_USERNAME="${GOOGLE_LOGIN}"
      - SPRING_MAIL_PASSWORD="${GOOGLE_PASSWORD}"
      - LOGGING_LEVEL_COM_ZAXXER_HIKARI=DEBUG
      - SERVER_PORT=13131
      - JAVA_OPTS=-Xms1g -Xmx4g -XX:MaxRAMPercentage=80.0 -XX:+UseContainerSupport
    links:
      - db
    deploy:
      resources:
        limits:
          memory: '2g'
        reservations:
          memory: '2g'
    command: ["java", "-jar", "/builder/fqw/target/fqw-1.0.0.jar"]
  protocol:
    restart: always
    pull_policy: never
    image: emiren-co/fqworkstation-root:latest
    command: ["java", "-jar", "/builder/protocol/target/protocol-0.9.0.jar"]
    ports:
      - "13134:13134"
    volumes:
      - ../protocol/src/main/resources:/app/resources/
    environment:
      - SERVER_FQW_URL=http://fqw:13131
      - JAVA_OPTS=-Xms1g -Xmx4g -XX:MaxRAMPercentage=80.0 -XX:+UseContainerSupport
    links:
      - fqw
    depends_on:
      - fqw
      - fqworkstation-builder
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '8g'
        reservations:
          memory: '2g'

  support:
    image: emiren-co/fqworkstation-root:latest
    pull_policy: never
    command: [ "java", "-jar", "/builder/support/target/support-0.5.0.jar" ]
    restart: always
    ports:
      - "13133:13133"
    depends_on:
      - db-support
      - fqworkstation-builder
    links:
      - db-support
    volumes:
      - ../support/src/main/resources:/app/resources/
    environment:
      - SPRING_SUPPORT_DATASOURCE_JDBC_URL=jdbc:postgresql://db-support:5432/support
      - SPRING_SUPPORT_DATASOURCE_USERNAME=temp
      - SPRING_SUPPORT_DATASOURCE_PASSWORD=temp
      - SPRING_SECURITY_USER_NAME="${SECURITY_LOGIN}"
      - SPRING_SECURITY_USER_PASSWORD="${SECURITY_PASSWORD}"
      - SERVER_FQW_URL="http://fqw:13131"
  hub:
    restart: always
    pull_policy: never
    image: emiren-co/fqworkstation-root:latest
    depends_on:
      - fqworkstation-builder
    command: [ "java", "-jar", "/builder/hub/target/hub-0.8.0.jar" ]
    ports:
      - "13136:13136"

volumes:
  db-data:

networks:
  default:
    driver: bridge
